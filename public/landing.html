<!DOCTYPE HTML>
<html>
<head>
    <title>Riverside Bridge Club (Unit 537) - Welcome</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="description" content="Riverside Bridge Club - Unit 537" />
    <meta name="keywords" content="bridge, club, riverside" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <style>
        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .landing-header {
            color: white;
            margin-bottom: 3rem;
        }
        .landing-header h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .landing-header h2 {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 1rem;
        }
        .landing-header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        .landing-buttons {
            display: flex;
            gap: 2rem;
            margin-top: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .landing-button {
            padding: 2rem 4rem;
            font-size: 1.5rem;
            min-width: 250px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .landing-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            color: #764ba2;
        }
        .copyright {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            opacity: 0.8;
        }
        .copyright a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div class="landing-header">
            <h1>Welcome to</h1>
            <h2>Riverside Bridge Club</h2>
            <h2>(Unit 537)</h2>
            <p>Please select your access level:</p>
        </div>
        
        <div class="landing-buttons">
            <a href="/members" class="landing-button">
                <strong>Members</strong><br>
                <span style="font-size: 0.8em;">Club Members Login</span>
            </a>
            <a href="/guests" class="landing-button">
                <strong>Guests</strong><br>
                <span style="font-size: 0.8em;">Visitor Information</span>
            </a>
        </div>
    </div>
    
    <div class="copyright">&copy; Riverside Bridge Club. Design: <a href="https://html5up.net">HTML5 UP</a>.</div>
</body>
</html>
