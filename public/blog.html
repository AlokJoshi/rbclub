<body class="is-preload">
  <div id="wrapper">
    <section class="blogs">
      <header class="parent">
        <h1>Welcome</h1>
        <h2>Create a new blog or edit your existing blog</h2>
      </header>
      <div class="content">
        <form method="">
          <div class="fields">
            <div class="field half wrap">
              <button type="button" style="width:stretch" class="button primary" onclick="setupforcreateblog()">Author
                Blog</button>
            </div>
            <div class="field half wrap">
              <button type="button" style="width:stretch" class="button primary" onclick="setupforeditblog()">Edit
                Blog</button>
            </div>
          </div>
          <select name="blogselect" id="blogselectid" style="display:none" onchange="populateblogcontent()">
            <option value="" disabled selected>Select a blog to edit</option>
          </select>
          <input type="text" name="blogtitle" id="blogtitleid" placeholder="Blog Title" required />
          <!-- <input type="text" name="blogauthor" id="blogauthorid" placeholder="" readonly /> -->
          <textarea id="mytextarea" placeholder='Start here..'></textarea>
          <div class="fields">
            <div class="field quarter wrap">
              <button type="button" title= "Save Blog" class="button primary" onclick="submitblog()">Save</button>
            </div>
            <div class="field quarter wrap">
              <button type="button" title= "Cancel Blog" class="button primary" onclick="cancelblog()">Cancel</button>
            </div>
            <div class="field quarter wrap">
              <button type="button" title= "Delete Blog" class="button primary" onclick="deleteblog()">Delete</button>
            </div>
            <div class="field quarter wrap">
              <button type="button" title= "Create N/S/E/W Hands" class="button primary" onclick="createhand()">Crt.Hand</button>
            </div>
          </div>
        </form>
      </div>

    </section>

      <h2>Create Hand</h2>

  <script>
    tinymce.init({
      selector: '#mytextarea',
      license_key: 'gpl', // gpl for open source, T8LK:... for commercial
      setup: function (editor) {
        editor.addShortcut('Alt+Shift+S', 'Description', function () {
          // Custom action here
          pasteCardImage('Spade');
        });
        editor.addShortcut('Alt+Shift+H', 'Description', function () {
          // Custom action here
          pasteCardImage('Heart');
        });
        editor.addShortcut('Alt+Shift+D', 'Description', function () {
          // Custom action here
          pasteCardImage('Diamond');
        });
        editor.addShortcut('Alt+Shift+C', 'Description', function () {
          // Custom action here
          pasteCardImage('Club');
        });
      }
    });
  </script>
